<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nice Answers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A diplomat's phrasebook: practice kind, graceful answers for awkward moments, one situation at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one briefing card at a time in a single 780px column; topic index above, sticky deck controls below. */
:root {
  --ground: #E7EBEE;       /* diplomatic-pouch grey */
  --card: #FCFCFA;         /* briefing paper */
  --ink: #17202A;
  --muted: #576372;
  --rule: #C9D0D7;
  --accent: #1D4E63;       /* protocol blue */
  --accent-ink: #FFFFFF;
  --accent-soft: #DDE8ED;
  --stamp: #9A2F2A;        /* rubber-stamp red, used sparingly */
  --stamp-soft: #F4E7E4;
  --shadow: 0 1px 2px rgba(23, 32, 42, .06), 0 10px 30px rgba(23, 32, 42, .08);

  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Didot LT STD", Georgia, serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --fs-label: .72rem;
  --fs-small: .9rem;
  --fs-body: 1rem;
  --fs-situation: clamp(1.15rem, 1rem + .8vw, 1.45rem);
  --fs-phrase: clamp(1.5rem, 1.15rem + 1.6vw, 2.15rem);
  --fs-brand: clamp(2rem, 1.4rem + 2.6vw, 3rem);

  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0F1418;
    --card: #182027;
    --ink: #E6EAED;
    --muted: #98A3AE;
    --rule: #2C3741;
    --accent: #88BCD1;
    --accent-ink: #0F1418;
    --accent-soft: #1D313C;
    --stamp: #E8928A;
    --stamp-soft: #2D1F20;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0F1418;
  --card: #182027;
  --ink: #E6EAED;
  --muted: #98A3AE;
  --rule: #2C3741;
  --accent: #88BCD1;
  --accent-ink: #0F1418;
  --accent-soft: #1D313C;
  --stamp: #E8928A;
  --stamp-soft: #2D1F20;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--fs-body);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 780px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(18px, 4vw, 40px) 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Masthead */
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 24px;
}
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 500;
  font-size: var(--fs-brand);
  line-height: 1;
  letter-spacing: -.01em;
  font-variation-settings: "opsz" 96;
}
.brand h1 em { font-style: italic; color: var(--accent); }
.tag {
  margin: 10px 0 0;
  font-family: var(--f-mono);
  font-size: var(--fs-label);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--card);
  padding: 2px;
}
.seg button, .tool {
  border: 0;
  background: none;
  padding: 7px 13px;
  border-radius: 2px;
  font-size: var(--fs-small);
  color: var(--muted);
  min-height: 36px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.tool {
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--card);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* Topic index */
.topics {
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--rule);
}
.topics::-webkit-scrollbar { display: none; }
.chips { display: flex; gap: 0 22px; white-space: nowrap; }
@media (min-width: 720px) { .chips { flex-wrap: wrap; } }
.chip {
  border: 0;
  background: none;
  padding: 10px 0 9px;
  font-family: var(--f-mono);
  font-size: var(--fs-label);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.chip .count { color: var(--stamp); margin-left: 5px; font-variant-numeric: tabular-nums; }

/* Briefing card */
.card {
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  box-shadow: var(--shadow);
  padding: clamp(20px, 4.5vw, 42px);
  display: flex;
  flex-direction: column;
  gap: 22px;
  min-height: min(540px, 68vh);
  scroll-margin-top: 12px;
  touch-action: pan-y;
}
.card-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 16px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--rule);
  font-family: var(--f-mono);
  font-size: var(--fs-label);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.card-head .cat { color: var(--accent); }
.card-head .pos { font-variant-numeric: tabular-nums; margin-left: auto; }
.eyebrow, .label {
  margin: 0 0 8px;
  font-family: var(--f-mono);
  font-size: var(--fs-label);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.situation {
  margin: 0;
  font-size: var(--fs-situation);
  font-weight: 500;
  line-height: 1.45;
  max-width: 34em;
  text-wrap: pretty;
}
.attempt { display: flex; flex-direction: column; gap: 8px; }
.prompt {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 1.2rem;
  color: var(--muted);
}
textarea {
  width: 100%;
  min-height: 3.4em;
  resize: vertical;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: transparent;
  padding: 10px 12px;
  line-height: 1.45;
}
textarea::placeholder { color: var(--muted); opacity: .85; }
textarea:focus-visible { outline-offset: 0; }
.open-btn {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 0;
  border-radius: 3px;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 14px 22px;
  font-weight: 600;
  letter-spacing: .01em;
  min-height: 48px;
}
.open-btn:hover { filter: brightness(1.08); }
.open-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* The answer */
.answer {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-top: 24px;
  border-top: 1px dashed var(--rule);
  scroll-margin-top: 16px;
}
.answer:focus { outline: none; }
.stamp {
  align-self: flex-start;
  font-family: var(--f-mono);
  font-size: var(--fs-label);
  font-weight: 500;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--stamp);
  border: 1.5px solid currentColor;
  border-radius: 2px;
  padding: 4px 9px 3px;
  transform: rotate(-2deg);
}
.phrase {
  margin: 0;
  font-family: var(--f-display);
  font-style: italic;
  font-weight: 500;
  font-size: var(--fs-phrase);
  line-height: 1.22;
  text-wrap: balance;
  font-variation-settings: "opsz" 48;
}
.alts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.alts li { position: relative; padding-left: 18px; max-width: 62ch; }
.alts li::before { content: "\2013"; position: absolute; left: 0; color: var(--muted); }
.why p:last-child { margin: 0; max-width: 62ch; }
.avoid {
  margin: 0;
  padding: 12px 14px;
  border-radius: 3px;
  background: var(--stamp-soft);
  max-width: 62ch;
}
.avoid .label { display: block; color: var(--stamp); margin-bottom: 4px; }

/* End-of-deck and empty states */
.finish {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: 14px;
}
.finish h2 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 500;
  font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem);
  line-height: 1.15;
  text-wrap: balance;
}
.finish p { margin: 0; color: var(--muted); max-width: 46ch; }
.finish-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

/* Buttons shared by deck bar and end states */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  padding: 11px 16px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--card);
  font-weight: 500;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { border-color: var(--ink); filter: brightness(1.15); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.btn.save[aria-pressed="true"] { color: var(--stamp); border-color: currentColor; }
.btn.save[aria-pressed="true"] svg { fill: currentColor; }

/* Deck bar */
.deckbar {
  position: sticky;
  bottom: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--ground);
}
.deckbar::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 100%;
  height: 18px;
  background: linear-gradient(to top, var(--ground), transparent);
  pointer-events: none;
}
.deckbar #prev { justify-self: start; }
.deckbar #next { justify-self: end; }
.keys {
  margin: -6px 0 22px;
  text-align: center;
  font-family: var(--f-mono);
  font-size: .68rem;
  letter-spacing: .08em;
  color: var(--muted);
}
.keys kbd {
  font-family: inherit;
  border: 1px solid var(--rule);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 0 5px;
  background: var(--card);
}
@media (hover: none) { .keys { display: none; } }

/* List view */
.list-head { margin: 0; color: var(--muted); font-size: var(--fs-small); }
.ledger {
  list-style: none;
  margin: 0 0 32px;
  padding: 0;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 4px;
  box-shadow: var(--shadow);
}
.ledger li + li { border-top: 1px solid var(--rule); }
.row {
  display: grid;
  gap: 6px;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 18px clamp(16px, 3vw, 28px);
}
.row:hover { background: var(--accent-soft); }
.row-meta {
  font-family: var(--f-mono);
  font-size: var(--fs-label);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.row-meta .saved-mark { color: var(--stamp); }
.row-sit { color: var(--muted); font-size: var(--fs-small); }
.row-ans {
  font-family: var(--f-display);
  font-style: italic;
  font-weight: 500;
  font-size: 1.28rem;
  line-height: 1.3;
}

/* Motion */
@keyframes enterNext { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes enterPrev { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
@keyframes unfold { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes stampIn {
  0% { opacity: 0; transform: rotate(-9deg) scale(1.45); }
  60% { opacity: 1; transform: rotate(-1deg) scale(.96); }
  100% { opacity: 1; transform: rotate(-2deg) scale(1); }
}
.card.enter-next { animation: enterNext .32s cubic-bezier(.2, .7, .2, 1); }
.card.enter-prev { animation: enterPrev .32s cubic-bezier(.2, .7, .2, 1); }
.answer.is-new { animation: unfold .45s cubic-bezier(.2, .7, .2, 1) both; }
.answer.is-new .stamp { animation: stampIn .5s .12s cubic-bezier(.2, .7, .2, 1) both; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Phones: keep the situation and the "Open the answer" button above the deck bar */
@media (max-width: 560px) {
  .app { gap: 14px; }
  .masthead { gap: 12px; }
  .brand h1 { font-size: 2.1rem; }
  .tag { margin-top: 6px; font-size: .64rem; letter-spacing: .1em; }
  .seg button, .tool { min-height: 34px; padding: 5px 11px; }
  .card { padding: 20px 18px 22px; gap: 16px; min-height: 0; }
  .card-head { padding-bottom: 10px; }
  .prompt { font-size: 1.1rem; }
  textarea { min-height: 2.8em; }
  .btn { padding-inline: 12px; }
  .deckbar { gap: 8px; padding-top: 10px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <h1>Nice <em>Answers</em></h1>
      <p class="tag">A diplomat’s phrasebook for awkward moments</p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="viewSlides" aria-pressed="true">Slides</button>
        <button type="button" id="viewList" aria-pressed="false">List</button>
      </div>
      <button type="button" class="tool" id="shuffle" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Shuffle
      </button>
    </div>
  </header>

  <nav class="topics" aria-label="Topics">
    <div class="chips" id="chips"></div>
  </nav>

  <main id="stage">
    <article class="card" id="card" aria-live="off"></article>
    <section id="list" aria-label="All situations" hidden></section>
  </main>

  <footer class="deckbar" id="deckbar">
    <button type="button" class="btn" id="prev" aria-label="Previous situation">← Back</button>
    <button type="button" class="btn save" id="save" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg>
      <span id="saveLabel">Remember</span>
    </button>
    <button type="button" class="btn primary" id="next" aria-label="Next situation">Next →</button>
  </footer>
  <p class="keys" id="keys"><kbd>←</kbd> <kbd>→</kbd> move &nbsp;·&nbsp; <kbd>Space</kbd> open the answer &nbsp;·&nbsp; <kbd>S</kbd> remember</p>
</div>

<script>
(function () {
  "use strict";

  var CATS = [
    { id: "no",       label: "Saying no" },
    { id: "sidestep", label: "Not answering" },
    { id: "honest",   label: "Kind honesty" },
    { id: "disagree", label: "Disagreeing" },
    { id: "time",     label: "Buying time" },
    { id: "pressure", label: "Under pressure" },
    { id: "grace",    label: "Grace notes" },
    { id: "exit",     label: "Exits" },
    { id: "diplomat", label: "Diplomat-speak" }
  ];

  // c = topic, s = situation, a = the talking point, alts = other ways to say it,
  // why = why it works (or, for diplomat-speak, what it really means), avoid = what not to say.
  var CARDS = [
    // ── Saying no ──────────────────────────────────────────────
    { c: "no",
      s: "A colleague invites you to their weekend barbecue. You’d rather not go, and you don’t want them to feel rejected.",
      a: "Thank you so much for thinking of me. I can’t make it, but I hope it’s a wonderful afternoon.",
      alts: ["That’s so kind. I already have plans that day, so enjoy it for me.",
             "I’ll have to miss this one, but I really appreciate the invitation."],
      why: "Gratitude first, then a clear no, then a warm wish. You don’t owe a reason. A detailed excuse only invites a counter-offer like “Come after, then!”",
      avoid: "“Maybe, I’ll see.” A vague maybe keeps them waiting and ends up feeling worse than a kind no." },

    { c: "no",
      s: "A friend asks you to help them move house on Saturday. You can’t face it.",
      a: "I wish I could, but I can’t take that on this weekend. I hope the move goes smoothly.",
      alts: ["I can’t help with the boxes, but can I bring you dinner that evening?"],
      why: "“I can’t take that on” is about your capacity, not about them. Offering something smaller, only if you mean it, shows you still care." },

    { c: "no",
      s: "Your manager asks you to take on a new project. You’re already at full capacity.",
      a: "I’d like to help. If I take this on, which of my current priorities should move?",
      alts: ["I want to do this well, and right now I can’t without dropping something. Can we look at my list together?"],
      why: "You don’t refuse. You make the trade-off visible and let the person who sets priorities decide. It reads as responsible, not unwilling.",
      avoid: "“I’m too busy.” It sounds like a complaint and leaves the problem with you." },

    { c: "no",
      s: "A friend asks to borrow a significant amount of money.",
      a: "I have a personal rule never to lend money to friends. Our friendship matters too much to me to risk it.",
      alts: ["I’m not able to lend money, but I’d be glad to help you think through other options."],
      why: "A standing rule takes the judgment out of it. You’re not deciding whether they can be trusted; you’re keeping a principle that protects you both." },

    { c: "no",
      s: "Someone you like as a friend asks you out on a date.",
      a: "I’m really flattered, and thank you for asking. I don’t feel the same way, but I truly value you as a friend.",
      why: "Here, kindness means clarity. A soft “I’m just busy lately” leaves them hoping. Thanking them honors the courage it took to ask." },

    { c: "no",
      s: "You’re asked to join a committee or volunteer for an event. You don’t want to.",
      a: "I’m honored you asked. I couldn’t give it the attention it deserves right now, so I’ll have to decline.",
      why: "Framing the no around doing the job properly makes it a compliment to the role, not a rejection of the people asking." },

    { c: "no",
      s: "A salesperson keeps pushing a product after you’ve said you’re just looking.",
      a: "Thank you, you’ve been very helpful. It’s not for me today.",
      why: "Thank them for their effort, then close the door. If they persist, repeat the same sentence calmly. No new reasons means nothing to argue with." },

    // ── Not answering ──────────────────────────────────────────
    { c: "sidestep",
      s: "At a family dinner, a relative asks how much you earn.",
      a: "Enough to be comfortable, thank you. How’s the new job treating you?",
      alts: ["I keep money talk between me and my bank, but I’m happy where I am."],
      why: "You answer the real question (are you doing all right?) without the number, then offer them a topic about themselves. Most people gladly take it." },

    { c: "sidestep",
      s: "Someone asks, yet again, when you’re going to get married or have children.",
      a: "When there’s news, you’ll be among the first to know.",
      alts: ["That’s a big question for a Tuesday! How are things with you?"],
      why: "It’s warm, it promises to include them, and it ends the topic without revealing anything. Nobody can push past it without seeming rude." },

    { c: "sidestep",
      s: "A coworker leans in: “Did you hear what happened with Sam?”",
      a: "I’d rather hear it from Sam. But how are you doing?",
      alts: ["I’m sure there’s more to it than any of us know."],
      why: "You decline the gossip without lecturing anyone, then turn to the person in front of you. People learn that you’re safe to confide in." },

    { c: "sidestep",
      s: "A dinner guest is trying to start a heated political argument.",
      a: "I have a rule never to discuss politics before dessert.",
      alts: ["I think we’d both rather enjoy this evening. Tell me about your trip."],
      why: "Humor sets the boundary without accusing anyone. It’s an old dinner-party convention for good reason: it protects the evening, and everyone can laugh along." },

    { c: "sidestep",
      s: "Someone asks about something confidential at work: a reorganization, a deal, a colleague’s situation.",
      a: "I’m not in a position to comment on that.",
      alts: ["That’s not mine to share, I’m afraid."],

  CARDS.forEach(function (card, i) { card.id = i; card.n = i + 1; });
  var CAT_LABEL = {};
  CATS.forEach(function (c) { CAT_LABEL[c.id] = c.label; });

  // ── helpers ─────────────────────────────────────────────────
  function $(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[ch];
    });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function naturalOrder() { return CARDS.map(function (c) { return c.id; }); }
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // ── state & storage ─────────────────────────────────────────
  var KEY = "nice-answers:v1";
  function load() {
    try { return JSON.parse(window.localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function validOrder(o) {
    if (!Array.isArray(o) || o.length !== CARDS.length) return false;
    var seen = {};
    for (var i = 0; i < o.length; i++) {
      if (!Number.isInteger(o[i]) || !CARDS[o[i]] || seen[o[i]]) return false;
      seen[o[i]] = true;
    }
    return true;
  }
  function validFilter(f) {
    return f === "all" || f === "saved" || CATS.some(function (c) { return c.id === f; });
  }

  var stored = load();
  var state = {
    filter: validFilter(stored.filter) ? stored.filter : "all",
    shuffled: !!stored.shuffled && validOrder(stored.order),
    order: validOrder(stored.order) ? stored.order : naturalOrder(),
    saved: new Set((Array.isArray(stored.saved) ? stored.saved : []).filter(function (id) { return Number.isInteger(id) && CARDS[id]; })),
    view: stored.view === "list" ? "list" : "slides",
    deck: [],
    pos: 0,
    revealed: false,
    attempts: {}
  };

  function computeDeck() {
    var base = state.shuffled ? state.order : naturalOrder();
    return base.filter(function (id) {
      if (state.filter === "all") return true;
      if (state.filter === "saved") return state.saved.has(id);
      return CARDS[id].c === state.filter;
    });
  }
  function currentCard() {
    var id = state.deck[state.pos];
    return id === undefined ? null : CARDS[id];
  }
  function persist() {
    var cur = currentCard();
    try {
      window.localStorage.setItem(KEY, JSON.stringify({
        saved: Array.from(state.saved),
        filter: state.filter,
        shuffled: state.shuffled,
        order: state.order,
        view: state.view,
        cardId: cur ? cur.id : null
      }));
    } catch (e) { /* storage unavailable: the page still works, it just won't remember */ }
  }

  state.deck = computeDeck();
  if (Number.isInteger(stored.cardId)) {
    var startAt = state.deck.indexOf(stored.cardId);
    if (startAt >= 0) state.pos = startAt;
  }

  // ── rendering ───────────────────────────────────────────────
  var cardEl = $("#card");
  var listEl = $("#list");

  function renderChips() {
    var items = [{ id: "all", label: "All" }].concat(CATS, [{ id: "saved", label: "Remembered" }]);
    $("#chips").innerHTML = items.map(function (it) {
      var count = it.id === "saved" ? '<span class="count">' + state.saved.size + "</span>" : "";
      return '<button type="button" class="chip" data-filter="' + it.id + '" aria-pressed="' + (state.filter === it.id) + '">' +
        esc(it.label) + count + "</button>";
    }).join("");
  }

  function slideHTML(c) {
    var total = state.deck.length;
    var isDiplomat = c.c === "diplomat";
    var alts = c.alts && c.alts.length
      ? '<div class="alts"><p class="label">Also works</p><ul>' +
          c.alts.map(function (t) { return "<li>“" + esc(t) + "”</li>"; }).join("") + "</ul></div>"
      : "";
    var avoid = c.avoid
      ? '<p class="avoid"><span class="label">Better not to say</span>' + esc(c.avoid) + "</p>"
      : "";
    return '' +
      '<header class="card-head">' +
        "<span>Briefing № " + pad(c.n) + "</span>" +
        '<span class="cat">' + esc(CAT_LABEL[c.c]) + "</span>" +
        '<span class="pos">' + pad(state.pos + 1) + " / " + pad(total) + "</span>" +
      "</header>" +
      "<div>" +
        '<p class="eyebrow">The situation</p>' +
        '<p class="situation">' + esc(c.s) + "</p>" +
      "</div>" +
      '<div class="attempt">' +
        '<label class="prompt" for="attempt">What would you say?</label>' +
        '<textarea id="attempt" rows="2" placeholder="Try your own words first (optional)"></textarea>' +
      "</div>" +
      '<button type="button" class="open-btn" id="open" data-act="open"' + (state.revealed ? " hidden" : "") + ">" +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h17v12h-17z"/><path d="m3.5 7.5 8.5 6.5 8.5-6.5"/></svg>' +
        "Open the answer" +
      "</button>" +
      '<section class="answer" id="answer" tabindex="-1" aria-label="The answer"' + (state.revealed ? "" : " hidden") + ">" +
        '<span class="stamp">Talking point</span>' +
        '<blockquote class="phrase">“' + esc(c.a) + "”</blockquote>" +
        alts +
        '<div class="why"><p class="label">' + (isDiplomat ? "What it really means" : "Why it works") + "</p><p>" + esc(c.why) + "</p></div>" +
        avoid +
      "</section>";
  }

  function finishHTML() {
    var n = state.deck.length;
    var label = state.filter === "all" ? "" : " in " + (state.filter === "saved" ? "Remembered" : CAT_LABEL[state.filter]);
    var savedBtn = state.saved.size && state.filter !== "saved"
      ? '<button type="button" class="btn" data-act="review">Review remembered (' + state.saved.size + ")</button>"
      : "";
    return '' +
      '<header class="card-head"><span>End of briefing</span><span class="pos">' + pad(n) + " / " + pad(n) + "</span></header>" +
      '<div class="finish">' +
        '<p class="eyebrow">Well done</p>' +
        "<h2>You’ve reached the end of the deck.</h2>" +
        "<p>That was " + (n === 1 ? "the one situation" : "all " + n + " situations") + esc(label) + ". Go round again in a new order. The phrases stick best when you say them out loud a few times.</p>" +
        '<div class="finish-actions">' +
          '<button type="button" class="btn primary" data-act="reshuffle">Shuffle and start again</button>' +
          '<button type="button" class="btn" data-act="restart">Start from the top</button>' +
          savedBtn +
        "</div>" +
      "</div>";
  }

  function emptyHTML() {
    return '' +
      '<header class="card-head"><span>Remembered</span><span class="pos">00 / 00</span></header>' +
      '<div class="finish">' +
        '<p class="eyebrow">Nothing here yet</p>' +
        "<h2>Your personal phrasebook is empty.</h2>" +
        "<p>Open any answer and tap “Remember” to keep it here. Come back to this list before a dinner, a meeting or a difficult call.</p>" +
        '<div class="finish-actions"><button type="button" class="btn primary" data-act="all">Browse all situations</button></div>' +
      "</div>";
  }

  function renderCard(dir) {
    var c = currentCard();
    if (!state.deck.length) cardEl.innerHTML = emptyHTML();
    else if (!c) cardEl.innerHTML = finishHTML();
    else cardEl.innerHTML = slideHTML(c);

    var ta = $("#attempt");
    if (ta && c) {
      ta.value = state.attempts[c.id] || "";
      ta.addEventListener("input", function () { state.attempts[c.id] = ta.value; });
    }

    cardEl.classList.remove("enter-next", "enter-prev");
    if (dir && !reduceMotion) {
      void cardEl.offsetWidth; // restart the animation
      cardEl.classList.add("enter-" + dir);
    }
  }

  function renderBar() {
    var c = currentCard();
    var hasDeck = state.deck.length > 0;
    $("#prev").disabled = !hasDeck || state.pos === 0;
    $("#next").disabled = !hasDeck || !c;
    var save = $("#save");
    var isSaved = !!c && state.saved.has(c.id);
    save.disabled = !c;
    save.setAttribute("aria-pressed", String(isSaved));
    $("#saveLabel").textContent = isSaved ? "Remembered" : "Remember";
  }

  function renderList() {
    var d = state.deck;
    var scope = state.filter === "all" ? "" : " · " + (state.filter === "saved" ? "Remembered" : CAT_LABEL[state.filter]);
    if (!d.length) {
      listEl.innerHTML = '<div class="card">' + emptyHTML() + "</div>";
      return;
    }
    listEl.innerHTML = '' +
      '<p class="list-head">' + d.length + " situation" + (d.length === 1 ? "" : "s") + esc(scope) + ". Tap one to practice it as a slide.</p>" +
      '<ol class="ledger">' +
      d.map(function (id, i) {
        var c = CARDS[id];
        var mark = state.saved.has(id) ? ' · <span class="saved-mark">Remembered</span>' : "";
        return '<li><button type="button" class="row" data-jump="' + i + '">' +
          '<span class="row-meta">№ ' + pad(c.n) + " · " + esc(CAT_LABEL[c.c]) + mark + "</span>" +
          '<span class="row-sit">' + esc(c.s) + "</span>" +
          '<span class="row-ans">“' + esc(c.a) + "”</span>" +
        "</button></li>";
      }).join("") +
      "</ol>";
  }

  function render(dir) {
    renderChips();
    $("#viewSlides").setAttribute("aria-pressed", String(state.view === "slides"));
    $("#viewList").setAttribute("aria-pressed", String(state.view === "list"));
    $("#shuffle").setAttribute("aria-pressed", String(state.shuffled));
    var slides = state.view === "slides";
    cardEl.hidden = !slides;
    listEl.hidden = slides;
    $("#deckbar").hidden = !slides;
    $("#keys").hidden = !slides;
    if (slides) { renderCard(dir); renderBar(); }
    else renderList();
  }

  // ── actions ─────────────────────────────────────────────────
  function bringCardIntoView() {
    var top = cardEl.getBoundingClientRect().top;
    if (top < 0) cardEl.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
  }

  function go(delta) {
    if (!state.deck.length) return;
    var next = Math.min(Math.max(state.pos + delta, 0), state.deck.length); // deck.length = end screen
    if (next === state.pos) return;
    state.pos = next;
    state.revealed = false;
    renderCard(delta > 0 ? "next" : "prev");
    renderBar();
    bringCardIntoView();
    persist();
  }

  function reveal() {
    if (state.revealed || !currentCard()) return;
    state.revealed = true;
    var ans = $("#answer");
    var btn = $("#open");
    if (btn) btn.hidden = true;
    if (!ans) return;
    ans.hidden = false;
    if (!reduceMotion) ans.classList.add("is-new");
    ans.focus({ preventScroll: true });
    var r = ans.getBoundingClientRect();
    var barH = $("#deckbar").getBoundingClientRect().height + 24;
    var overflow = r.bottom - (window.innerHeight - barH);
    if (overflow > 0) {
      window.scrollBy({ top: Math.min(overflow, r.top - 16), behavior: reduceMotion ? "auto" : "smooth" });
    }
  }

  function toggleSave() {
    var c = currentCard();
    if (!c) return;
    if (state.saved.has(c.id)) state.saved.delete(c.id); else state.saved.add(c.id);
    renderBar();
    renderChips();
    persist();
  }

  function setFilter(f) {
    if (!validFilter(f)) return;
    state.filter = f;
    state.deck = computeDeck();
    state.pos = 0;
    state.revealed = false;
    render(state.view === "slides" ? "next" : null);
    persist();
  }

  function setShuffle(on) {
    state.shuffled = on;
    if (on) state.order = shuffled(naturalOrder());
    state.deck = computeDeck();
    state.pos = 0;
    state.revealed = false;
    render(state.view === "slides" ? "next" : null);
    persist();
  }

  function setView(v) {
    if (state.view === v) return;
    state.view = v;
    if (v === "slides") state.deck = computeDeck();
    render(null);
    persist();
  }

  // ── wiring ──────────────────────────────────────────────────
  $("#chips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]");
    if (b) setFilter(b.getAttribute("data-filter"));
  });
  $("#viewSlides").addEventListener("click", function () { setView("slides"); });
  $("#viewList").addEventListener("click", function () { setView("list"); });
  $("#shuffle").addEventListener("click", function () { setShuffle(!state.shuffled); });
  $("#prev").addEventListener("click", function () { go(-1); });
  $("#next").addEventListener("click", function () { go(1); });
  $("#save").addEventListener("click", toggleSave);

  cardEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "open") reveal();
    else if (act === "restart") { state.pos = 0; state.revealed = false; renderCard("next"); renderBar(); bringCardIntoView(); persist(); }
    else if (act === "reshuffle") { setShuffle(true); bringCardIntoView(); }
    else if (act === "review") setFilter("saved");
    else if (act === "all") setFilter("all");
  });

  listEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-jump]");
    if (b) {
      state.view = "slides";
      state.pos = Number(b.getAttribute("data-jump"));
      state.revealed = false;
      render("next");
      bringCardIntoView();
      persist();
      return;
    }
    var a = e.target.closest("[data-act]");
    if (a && a.getAttribute("data-act") === "all") setFilter("all");
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t.closest && t.closest("textarea, input, select, [contenteditable]")) {
      if (e.key === "Escape") t.blur();
      return;
    }
    if (state.view !== "slides") return;
    // Space/Enter belong to the deck unless focus is on some other control (a topic, a menu button).
    var onControl = t.closest && t.closest("button, a");
    var onDeckButton = t.closest && t.closest("#deckbar button");
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    else if ((e.key === " " && (!onControl || onDeckButton)) || (e.key === "Enter" && !onControl)) {
      e.preventDefault();
      if (!state.revealed && currentCard()) reveal(); else go(1);
    }
    else if (e.key === "s" || e.key === "S") { toggleSave(); }
  });

  // swipe left / right on the card
  var touchX = null, touchY = null;
  cardEl.addEventListener("touchstart", function (e) {
    if (e.target.closest("textarea")) { touchX = null; return; }
    var p = e.changedTouches[0];
    touchX = p.clientX; touchY = p.clientY;
  }, { passive: true });
  cardEl.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var p = e.changedTouches[0];
    var dx = p.clientX - touchX, dy = p.clientY - touchY;
    touchX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  render(null);
})();
</script>
</body>
</html>
